<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/icon.png">
    
</head>
<body>
    <h1>Calculator</h1>
    <div class="container">
        <div class="Screen">
            <div class="small"></div>
            <div class="big"></div>
        </div>

        <div class="Keys">
            <div id="ac"><button class="Key" id="clear">AC</button></div>
            <div><button class="Key opk">/</button></div>

            <div><button class="Key nk" id="">7</button></div>
            <div><button class="Key nk" id="">8</button></div>
            <div><button class="Key nk" id="">9</button></div>

            <div><button class="Key opk">*</button></div>

            <div><button class="Key nk" id="">4</button></div>
            <div><button class="Key nk" id="">5</button></div>
            <div><button class="Key nk" id="">6</button></div>
            <div><button class="Key opk">-</button></div>

            <div><button class="Key nk" id="">1</button></div>
            <div><button class="Key nk" id="">2</button></div>
            <div><button class="Key nk" id="">3</button></div>
            <div><button class="Key opk">+</button></div>
            
            <div id="z"><button class="Key nk" id="zero">0</button></div>
            <div><button class="Key">.</button></div>
            <div id="del"><button class="Key nk" id="cb"><img src="images/backspace.svg" alt="C" height="20px" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', this.alt);"></button></div>
            <div><button class="Key opk eq">=</button></div>
           
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
